apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources:
  - ../../base
images:
  - name: ghcr.io/your-org/shop-gateway
    newName: ghcr.io/your-org/shop-gateway
    newTag: latest
  - name: ghcr.io/your-org/shop-order
    newName: ghcr.io/your-org/shop-order
    newTag: latest
  - name: ghcr.io/your-org/shop-product
    newName: ghcr.io/your-org/shop-product
    newTag: latest
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: {kind: Ingress, name: gateway}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop.example.com
